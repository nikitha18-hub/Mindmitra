<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#04111d">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="description" content="MindMitra is a supportive dementia-engagement platform.">
    <title>{% block title %}MindMitra{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    {% block styles %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="{{ url_for('index') }}" aria-label="MindMitra home">MindMitra</a>
      <nav class="main-nav" aria-label="Main menu">
        <a href="{{ url_for('patient') }}">Patient</a>
        <a href="{{ url_for('caregiver') }}">Caregiver</a>
        <a href="{{ url_for('login') }}">Login</a>
        {% if current_name %}<span class="nav-user">{{ current_name }}</span>{% endif %}
        {% if current_name %}<a href="{{ url_for('logout') }}">Logout</a>{% endif %}
        <button class="calm-toggle" type="button" data-calm-toggle aria-pressed="false">
          <span class="calm-toggle-label">Calm Mode: Off</span>
        </button>
      </nav>
    </header>

    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/core/motion.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/core/a11y.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
