{% extends "base.html" %}
{% block title %}Create Patient Account - MindMitra{% endblock %}
{% block content %}
<section class="glass-panel auth-card" aria-labelledby="register-title">
  <h1 id="register-title">Create a patient account</h1>
  {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('register_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="name" required minlength="2">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required minlength="3">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
    <button class="button button-primary" type="submit">Create account</button>
  </form>
  <p class="demo-link">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</section>
{% endblock %}
