{% extends "base.html" %}
{% block title %}Memory Map - MindMitra{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/mindmap.css') }}">
{% endblock %}
{% block content %}
<section aria-labelledby="mindmap-title">
  <header class="page-heading">
    <p class="eyebrow">Living constellation</p>
    <h1 id="mindmap-title">Asha's Memory Map</h1>
  </header>
  <div class="mindmap-toolbar" role="toolbar" aria-label="Memory map tools">
    <label for="node-search">Search memories</label>
    <input id="node-search" type="search" placeholder="Search a name or place">
    <button class="button" type="button" id="fit-map">Fit view</button>
  </div>
  <div class="mindmap-layout">
    <canvas id="memory-canvas" aria-label="Interactive constellation map"></canvas>
    <aside class="glass-panel memory-detail" aria-live="polite">
      <p class="eyebrow">Selected memory</p>
      <h2 id="memory-label">Asha</h2>
      <p id="memory-description">This is Asha.</p>
      <button class="button" type="button" id="read-memory">Read aloud</button>
    </aside>
  </div>
  <p id="mindmap-status" aria-live="polite"></p>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/mindmap.js') }}" defer></script>
{% endblock %}
