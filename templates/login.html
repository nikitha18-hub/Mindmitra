{% extends "base.html" %}
{% block title %}Login - MindMitra{% endblock %}
{% block content %}
<section class="glass-panel auth-card" aria-labelledby="login-title">
  <h1 id="login-title">Welcome back</h1>
  {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button button-primary" type="submit">Sign in</button>
  </form>
  <p class="demo-link">Or <a href="{{ url_for('demo') }}">open the guided fictional demo</a>.</p>
  <p class="demo-link">New patient? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</section>
{% endblock %}
