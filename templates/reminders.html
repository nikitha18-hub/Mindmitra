{% extends "base.html" %}
{% block title %}Reminders - MindMitra{% endblock %}
{% block content %}
<section aria-labelledby="reminders-title">
  <header class="page-heading">
    <p class="eyebrow">Today</p>
    <h1 id="reminders-title">Gentle Reminders</h1>
  </header>
  <div class="reminder-timeline" id="reminder-timeline">
    <article class="glass-panel reminder-item"><time>09:00</time><h2>Drink a glass of water</h2><button type="button" data-complete>Mark complete</button></article>
    <article class="glass-panel reminder-item"><time>11:30</time><h2>Look at the family photo</h2><button type="button" data-complete>Mark complete</button></article>
    <article class="glass-panel reminder-item"><time>16:00</time><h2>Sit in the garden</h2><button type="button" data-complete>Mark complete</button></article>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/reminders.js') }}" defer></script>
{% endblock %}
